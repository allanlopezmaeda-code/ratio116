<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Pedidos Cafetería</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.btn-primary{
    background:#2e7d32;
    color:white;
}

.btn-danger{
    background:#c62828;
    color:white;
}

.btn-export{
    background:#1565c0;
    color:white;
}

.fullscreen-btn{
    background:#444;
    color:white;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.pedido{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #ddd;
}

.completado{
    text-decoration:line-through;
    color:gray;
}

</style>
</head>

<body>

<div id="pedidoPanel" class="panel">

    <div class="header">
        <h2>Nuevo Pedido</h2>
        <button class="fullscreen-btn"
            onclick="pantallaCompleta('pedidoPanel')">⛶</button>
    </div>

    <label>Seleccione una bebida</label>

    <select id="tipoProducto" onchange="mostrarOpciones()">

        <option value="">Seleccione</option>

        <option value="americano">Café Americano</option>
        <option value="espresso">Espresso</option>
        <option value="cappuccino">Cappuccino</option>
        <option value="latte">Latte</option>
        <option value="mocha">Mocha</option>
        <option value="macchiato">Macchiato</option>
        <option value="cafefrio">Café Frío</option>
        <option value="te">Té</option>
        <option value="chocolate">Chocolate Caliente</option>

    </select>

    <div id="opciones"></div>

    <button
        class="btn-primary"
        onclick="realizarPedido()">

        REALIZAR PEDIDO

    </button>

</div>

<div id="colaPanel" class="panel">

    <div class="header">
        <h2>Cola de Pedidos</h2>

        <button
            class="fullscreen-btn"
            onclick="pantallaCompleta('colaPanel')">

            ⛶

        </button>
    </div>

    <div id="listaPedidos"></div>

    <br>

    <button
        class="btn-export"
        onclick="exportarCSV()">

        Exportar a Excel

    </button>

    <button
        class="btn-danger"
        onclick="borrarPedidos()">

        Borrar Registros

    </button>

</div>

<script>

let pedidos = [];
let contador = 1;

function mostrarOpciones(){

    const bebida =
        document.getElementById("tipoProducto").value;

    const opciones =
        document.getElementById("opciones");

    const consumo = `
        <label>Consumo</label>
        <select id="consumo">
            <option>Para aquí</option>
            <option>Para llevar</option>
        </select>
    `;

    switch(bebida){

        case "americano":

            opciones.innerHTML = `
                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                <label>Azúcar</label>
                <select id="azucar">
                    <option>Sin azúcar</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>

                ${consumo}
            `;
        break;

        case "espresso":

            opciones.innerHTML = `
                <label>Tipo</label>
                <select id="tipo">
                    <option>Sencillo</option>
                    <option>Doble</option>
                </select>

                <label>Azúcar</label>
                <select id="azucar">
                    <option>Sin azúcar</option>
                    <option>1</option>
                    <option>2</option>
                </select>

                ${consumo}
            `;
        break;

        case "cappuccino":

            opciones.innerHTML = `
                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                <label>Leche</label>
                <select id="leche">
                    <option>Entera</option>
                    <option>Descremada</option>
                    <option>Deslactosada</option>
                    <option>Almendra</option>
                    <option>Avena</option>
                </select>

                <label>Extra Shot</label>
                <select id="extraShot">
                    <option>No</option>
                    <option>Sí</option>
                </select>

                <label>Canela</label>
                <select id="canela">
                    <option>Sí</option>
                    <option>No</option>
                </select>

                ${consumo}
            `;
        break;

        case "latte":

            opciones.innerHTML = `
                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                <label>Leche</label>
                <select id="leche">
                    <option>Entera</option>
                    <option>Descremada</option>
                    <option>Deslactosada</option>
                    <option>Almendra</option>
                    <option>Avena</option>
                </select>

                <label>Sabor</label>
                <select id="sabor">
                    <option>Natural</option>
                    <option>Vainilla</option>
                    <option>Caramelo</option>
                    <option>Avellana</option>
                    <option>Mocha</option>
                </select>

                <label>Extra Shot</label>
                <select id="extraShot">
                    <option>No</option>
                    <option>Sí</option>
                </select>

                ${consumo}
            `;
        break;

        case "mocha":

            opciones.innerHTML = `
                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                <label>Leche</label>
                <select id="leche">
                    <option>Entera</option>
                    <option>Descremada</option>
                    <option>Deslactosada</option>
                    <option>Almendra</option>
                    <option>Avena</option>
                </select>

                <label>Crema Batida</label>
                <select id="crema">
                    <option>Sí</option>
                    <option>No</option>
                </select>

                ${consumo}
            `;
        break;

        case "macchiato":

            opciones.innerHTML = `
                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                <label>Leche</label>
                <select id="leche">
                    <option>Entera</option>
                    <option>Descremada</option>
                    <option>Deslactosada</option>
                </select>

                ${consumo}
            `;
        break;

        case "cafefrio":

            opciones.innerHTML = `
                <label>Tipo</label>
                <select id="tipo">
                    <option>Cold Brew</option>
                    <option>Iced Latte</option>
                    <option>Iced Mocha</option>
                    <option>Frappé</option>
                </select>

                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                ${consumo}
            `;
        break;

        case "te":

            opciones.innerHTML = `
                <label>Tipo</label>
                <select id="tipo">
                    <option>Negro</option>
                    <option>Verde</option>
                    <option>Manzanilla</option>
                    <option>Chai</option>
                    <option>Frutos rojos</option>
                </select>

                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                ${consumo}
            `;
        break;

        case "chocolate":

            opciones.innerHTML = `
                <label>Tamaño</label>
                <select id="tamano">
                    <option>Chico</option>
                    <option>Mediano</option>
                    <option>Grande</option>
                </select>

                <label>Leche</label>
                <select id="leche">
                    <option>Entera</option>
                    <option>Descremada</option>
                    <option>Deslactosada</option>
                </select>

                <label>Crema Batida</label>
                <select id="crema">
                    <option>Sí</option>
                    <option>No</option>
                </select>

                ${consumo}
            `;
        break;

        default:
            opciones.innerHTML = "";
    }
}

function realizarPedido(){

    const bebida =
        document.getElementById("tipoProducto").value;

    if(!bebida){
        alert("Seleccione una bebida");
        return;
    }

    const numeroPedido = contador++;

    const detalles = {};

    document.querySelectorAll("#opciones select")
        .forEach(campo=>{
            detalles[campo.id]=campo.value;
        });

    const pedido = {
        numero: numeroPedido,
        fecha: new Date().toLocaleString(),
        bebida: bebida,
        detalles: detalles,
        completado:false
    };

    pedidos.push(pedido);

    renderPedidos();

    alert("Pedido #" + numeroPedido + " registrado");
}

function renderPedidos(){

    const lista =
        document.getElementById("listaPedidos");

    lista.innerHTML = "";

    pedidos.forEach((pedido,index)=>{

        const detalleTexto =
            Object.values(pedido.detalles).join(" | ");

        lista.innerHTML += `
            <div class="pedido ${pedido.completado ? 'completado':''}">

                <div>
                    <strong>#${pedido.numero}</strong><br>
                    ${pedido.bebida}<br>
                    ${detalleTexto}<br>
                    <small>${pedido.fecha}</small>
                </div>

                <input
                    type="checkbox"
                    ${pedido.completado ? 'checked':''}
                    onchange="togglePedido(${index})">

            </div>
        `;
    });

}

function togglePedido(index){

    pedidos[index].completado =
        !pedidos[index].completado;

    renderPedidos();

}

function exportarCSV(){

    let csv =
    "Pedido,Fecha,Bebida,Detalles,Estado\n";

    pedidos.forEach(p=>{

        const detalles =
        Object.values(p.detalles).join(" | ");

        csv += `"${p.numero}","${p.fecha}","${p.bebida}","${detalles}","${p.completado ? "Completado":"Pendiente"}"\n`;

    });

    const blob =
        new Blob([csv],{
        type:"text/csv;charset=utf-8;"
    });

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "pedidos.csv";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);
}

function borrarPedidos(){

    if(confirm("¿Seguro que desea borrar todos los registros?")){

        pedidos = [];
        contador = 1;

        renderPedidos();

    }

}

function pantallaCompleta(id){

    const elemento =
        document.getElementById(id);

    if(elemento.requestFullscreen){

        elemento.requestFullscreen();

    }

}

</script>

</body>
</html>
