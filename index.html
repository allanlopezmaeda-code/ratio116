
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Pedidos Cafetería</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f4f4f4;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,.2);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 5px;
}

.btn-primary {
    background: #2e7d32;
    color: white;
    width: 100%;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

.btn-export {
    background: #1565c0;
    color: white;
}

.btn-danger {
    background: #c62828;
    color: white;
}

.fullscreen-btn {
    background: #444;
    color: white;
}
#botonesBebidas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-bottom:20px;
}

.bebida-btn{
    padding:20px;
    font-size:18px;
    font-weight:bold;
    background:#f5f5f5;
    border:2px solid #ccc;
    color:#333;
}

.bebida-btn:hover{
    background:#e8f5e9;
}

.bebida-seleccionada{
    background:#2e7d32 !important;
    color:white !important;
    border-color:#2e7d32 !important;
}

.pedido {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 10px;
}

.completado {
    color: gray;
    text-decoration: line-through;
}
</style>
</head>

<body>

<div id="pedidoPanel" class="panel">
    <div class="header">
        <h2>Nuevo Pedido</h2>
        <button class="fullscreen-btn"
            onclick="pantallaCompleta('pedidoPanel')">⛶</button>
    </div>

   <label>Seleccione una bebida</label>

<div id="botonesBebidas">

  <button
    type="button"
    class="bebida-btn"
    data-bebida="americano"
    data-nombre="☕ americano"
    onclick="seleccionarBebida('americano', this)">
    ☕ americano
</button>
    
   <button
    type="button"
    class="bebida-btn"
    data-bebida="capuchino"
data-nombre="☕ capuchino"
    onclick="seleccionarBebida('capuchino', this)">
    ☕ capuchino
</button>

    <button
    type="button"
    class="bebida-btn"
    data-bebida="latte"
data-nombre="☕ latte"
    onclick="seleccionarBebida('latte', this)">
    ☕ latte
</button>

    <button
    type="button"
    class="bebida-btn"
    data-bebida="matcha"
data-nombre="🍵 matcha"
    onclick="seleccionarBebida('matcha', this)">
    ☕ matcha
</button>

   <button
    type="button"
    class="bebida-btn"
   data-bebida="chocolate"
data-nombre="🍫 chocolate Caliente"
    onclick="seleccionarBebida('chocolate', this)">
    ☕ chocolate
</button>

</div>

    <button class="btn-primary" onclick="realizarPedido()">
        REALIZAR PEDIDO
    </button>
</div>

<div id="colaPanel" class="panel">
    <div class="header">
        <h2>Cola de Pedidos</h2>
        <button class="fullscreen-btn"
            onclick="pantallaCompleta('colaPanel')">⛶</button>
    </div>

    <div id="listaPedidos"></div>

    <br>

    <button class="btn-export" onclick="exportarCSV()">
        Exportar a Excel
    </button>

    <button class="btn-danger" onclick="borrarPedidos()">
        Borrar Registros
    </button>
</div>

<script>
let pedidos = [];
let contador = 1;
let bebidasSeleccionadas = {};

function seleccionarBebida(bebida, boton){

    bebidasSeleccionadas[bebida] =
        (bebidasSeleccionadas[bebida] || 0) + 1;

    actualizarBotones();

}

function actualizarBotones(){

    document
    .querySelectorAll(".bebida-btn")
    .forEach(btn=>{

        const bebida =
            btn.dataset.bebida;

        const cantidad =
            bebidasSeleccionadas[bebida] || 0;

        btn.classList.remove(
            "bebida-seleccionada"
        );

        let textoOriginal =
            btn.dataset.nombre;

        if(cantidad > 0){

            btn.classList.add(
                "bebida-seleccionada"
            );

            btn.innerHTML =
                `${textoOriginal}<br><strong>${cantidad}x</strong>`;

        }else{

            btn.innerHTML = textoOriginal;

        }

    });

}
    
function mostrarMensaje(texto, color = "#2e7d32", numeroPedido = null) {
    const mensaje = document.createElement("div");

    mensaje.style.position = "fixed";
    mensaje.style.top = "20px";
    mensaje.style.right = "20px";
    mensaje.style.background = color;
    mensaje.style.color = "white";
    mensaje.style.padding = "20px";
    mensaje.style.borderRadius = "10px";
    mensaje.style.boxShadow = "0 4px 12px rgba(0,0,0,.3)";
    mensaje.style.zIndex = "999999";
    mensaje.style.fontSize = "22px";
    mensaje.style.fontWeight = "bold";
    mensaje.style.textAlign = "center";
    mensaje.style.minWidth = "220px";
    mensaje.style.maxWidth = "calc(100vw - 80px)";

    if (numeroPedido !== null) {
        mensaje.innerHTML = `
            ✅ Pedido registrado
            <br>
            <span style="display:block; font-size:90px; margin-top:8px;">
                #${numeroPedido}
            </span>
            <span style="display:block; font-size:15px; margin-top:5px;">
                Guarda tu número de pedido
            </span>
        `;
    } else {
        mensaje.textContent = texto;
    }

    const contenedor = document.fullscreenElement || document.body;
    contenedor.appendChild(mensaje);

    setTimeout(() => {
        mensaje.remove();
    }, numeroPedido !== null ? 5000 : 2500);
}
    
function realizarPedido(){

    if(
        Object.keys(bebidasSeleccionadas)
        .length === 0
    ){

        mostrarMensaje(
            "Seleccione una bebida",
            "#c62828"
        );

        return;
    const numeroPedido = contador++;

    pedidos.push({

        numero: numeroPedido,
        fecha: new Date().toLocaleString(),
        bebida: bebidaSeleccionada,
        detalles: {},
        completado: false

    });

    renderPedidos();

    bebidaSeleccionada = "";

    document
        .querySelectorAll(".bebida-btn")
        .forEach(btn =>
            btn.classList.remove("bebida-seleccionada")
        );

    mostrarMensaje(
        "",
        "#2e7d32",
        numeroPedido
    );

}

function traducirBebida(codigo) {

    const nombres = {
        americano: "Café Americano",
        capuchino: "Capuchino",
        latte: "Latte",
        matcha: "Matcha",
        chocolate: "Chocolate Caliente"
    };

    return nombres[codigo] || codigo;

}

function renderPedidos() {
    const lista = document.getElementById("listaPedidos");

    lista.innerHTML = "";

    pedidos.forEach((pedido, index) => {

        lista.innerHTML += `
            <div class="pedido ${pedido.completado ? 'completado' : ''}">
                <div>
                   <strong style="font-size:20px; color:#2e7d32;">
    Pedido #${pedido.numero}
</strong>
<br>
<strong>
${Object.entries(pedido.bebidas)
.map(([bebida,cantidad]) =>
    `${cantidad}x ${traducirBebida(bebida)}`
)
.join("<br>")}
  
</strong>
<br>
<small>${pedido.fecha}</small>
                </div>

                <input
                    type="checkbox"
                    ${pedido.completado ? 'checked' : ''}
                    onchange="togglePedido(${index})">
            </div>
        `;
    });
}

function togglePedido(index) {
    pedidos[index].completado = !pedidos[index].completado;
    renderPedidos();
}

function exportarCSV() {
    let csv = "Pedido,Fecha,Bebida,Detalles,Estado\n";

   pedidos.forEach(p => {

    const bebidas = Object.entries(p.bebidas)
        .map(([bebida,cantidad]) =>
            `${cantidad}x ${traducirBebida(bebida)}`
        )
        .join(" | ");

    csv += `"${p.numero}","${p.fecha}","${bebidas}","","${p.completado ? "Completado" : "Pendiente"}"\n`;

});

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "pedidos.csv";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

function borrarPedidos() {
    if (confirm("¿Desea eliminar todos los registros?")) {
        pedidos = [];
        contador = 1;
        renderPedidos();
    }
}

function pantallaCompleta(id) {
    const elemento = document.getElementById(id);

    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else if (elemento.requestFullscreen) {
        elemento.requestFullscreen();
    }
}
</script>

</body>
</html>
