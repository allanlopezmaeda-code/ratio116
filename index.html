<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafetería - Sistema de Pedidos</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

.btn-verde{
    background:#2e7d32;
    color:white;
}

.btn-rojo{
    background:#c62828;
    color:white;
}

.btn-azul{
    background:#1565c0;
    color:white;
}

.btn-full{
    background:#444;
    color:white;
}

select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    margin-top:5px;
}

.pedido{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:10px;
}

.completado{
    text-decoration:line-through;
    color:gray;
}

.notificacion{

    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    background:#2e7d32;
    color:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 20px rgba(0,0,0,.4);

    text-align:center;

    z-index:999999;
}

.numero-pedido{
    font-size:90px;
    font-weight:bold;
}

</style>
</head>
<body>

<div id="pedidoPanel" class="panel">

    <div class="header">
        <h2>Nuevo Pedido</h2>

        <button
            class="btn-full"
            onclick="pantallaCompleta('pedidoPanel')">

            ⛶

        </button>
    </div>

    <label>Bebida</label>

    <select id="bebida">
        <option>Café Americano</option>
        <option>Espresso</option>
        <option>Cappuccino</option>
        <option>Latte</option>
        <option>Mocha</option>
        <option>Macchiato</option>
        <option>Café Frío</option>
        <option>Té</option>
        <option>Chocolate Caliente</option>
    </select>

    <label>Tamaño</label>

    <select id="tamano">
        <option>Chico</option>
        <option>Mediano</option>
        <option>Grande</option>
    </select>

    <label>Consumo</label>

    <select id="consumo">
        <option>Para aquí</option>
        <option>Para llevar</option>
    </select>

    <button
        class="btn-verde"
        onclick="crearPedido()">

        REALIZAR PEDIDO

    </button>

</div>

<div id="colaPanel" class="panel">

    <div class="header">
        <h2>Cola de Pedidos</h2>

        <button
            class="btn-full"
            onclick="pantallaCompleta('colaPanel')">

            ⛶

        </button>
    </div>

    <div id="listaPedidos"></div>

    <br>

    <button
        class="btn-azul"
        onclick="exportarCSV()">

        Exportar Excel

    </button>

    <button
        class="btn-rojo"
        onclick="borrarPedidos()">

        Borrar Registros

    </button>

</div>

<script>

let pedidos = [];
let contador = 1;

function crearPedido(){

    const numeroPedido = contador++;

    const pedido = {

        numero: numeroPedido,

        bebida:
        document.getElementById("bebida").value,

        tamano:
        document.getElementById("tamano").value,

        consumo:
        document.getElementById("consumo").value,

        fecha:
        new Date().toLocaleString(),

        completado:false

    };

    pedidos.push(pedido);

    mostrarPedidos();

    mostrarNotificacion(numeroPedido);

}

function mostrarNotificacion(numero){

    const n =
        document.createElement("div");

    n.className =
        "notificacion";

    n.innerHTML = `

        <div>
            ✅ Pedido Registrado
        </div>

        <div class="numero-pedido">
            #${numero}
        </div>

        <div>
            Guarde este número
        </div>

    `;

    const destino =
        document.fullscreenElement ||
        document.body;

    destino.appendChild(n);

    setTimeout(()=>{

        n.remove();

    },5000);

}

function mostrarPedidos(){

    const lista =
        document.getElementById(
            "listaPedidos"
        );

    lista.innerHTML = "";

    pedidos.forEach((p,index)=>{

        lista.innerHTML += `

        <div class="pedido ${p.completado ? 'completado' : ''}">

            <div>

                <strong>#${p.numero}</strong><br>

                ${p.bebida}<br>

                ${p.tamano}<br>

                ${p.consumo}

            </div>

            <input
                type="checkbox"
                ${p.completado ? 'checked' : ''}
                onchange="togglePedido(${index})">

        </div>

        `;

    });

}

function togglePedido(index){

    pedidos[index].completado =
    !pedidos[index].completado;

    mostrarPedidos();

}

function exportarCSV(){

    let csv =
"Pedido,Bebida,Tamaño,Consumo,Estado\n";

    pedidos.forEach(p=>{

        csv +=
`${p.numero},${p.bebida},${p.tamano},${p.consumo},${p.completado ? 'Completado':'Pendiente'}\n`;

    });

    const blob =
        new Blob([csv]);

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "pedidos.csv";

    a.click();

}

function borrarPedidos(){

    if(confirm("¿Borrar todos los registros?")){

        pedidos = [];

        contador = 1;

        mostrarPedidos();

    }

}

function pantallaCompleta(id){

    const elemento =
        document.getElementById(id);

    if(elemento.requestFullscreen){

        elemento.requestFullscreen();

    }

}

</script>

</body>
</html>
